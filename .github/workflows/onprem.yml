name: On-prem

# Builds the on-prem image and runs the whole Compose stack
# (deploy/onprem, docs/PairSight-OnPrem.md) with e2e/onprem.spec.ts against
# it: first admin, People, the Jev key against the stub, and a run of the
# sample files. Also compiles the Windows installer (deploy/windows). Only
# when something they're made from changes, since building takes minutes.

on:
  pull_request:
    paths:
      - deploy/onprem/**
      - deploy/windows/**
      - .dockerignore
      - next.config.ts
      - .github/workflows/onprem.yml
      - package.json
      - pnpm-lock.yaml
      - prisma/**
      - services/splink/**
      - scripts/run-once-sql.mjs
      - scripts/onprem-env.mjs
      - scripts/jev-stub.mjs
      - e2e/onprem.spec.ts
      - src/server/auth/**
      - src/server/deployment.ts
      # What keeps the marketing site out of the image.
      - src/proxy.ts
      - src/server/pairsight/demo-preview.ts
      - src/server/pairsight/landing-demo.ts
  workflow_dispatch:

concurrency:
  group: onprem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PAIRSIGHT_IMAGE: pairsight-onprem:ci
      COMPOSE: docker compose -f deploy/onprem/compose.yaml -f deploy/onprem/compose.test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/onprem/Dockerfile
          tags: pairsight-onprem:ci
          load: true
          build-args: PAIRSIGHT_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=onprem
          cache-to: type=gha,scope=onprem,mode=max
      - run: node scripts/onprem-env.mjs --image pairsight-onprem:ci
      - run: $COMPOSE up -d --wait --wait-timeout 300
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/onprem.spec.ts --project=chromium
        env:
          E2E_ONPREM: '1'
          E2E_BASE_URL: http://localhost:3080
          E2E_JEV_ADDRESS: http://jev-stub:4010/v1
          # The spec runs against the stack, not a database of its own.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - if: failure()
        run: $COMPOSE logs --no-color --timestamps > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onprem-report
          path: |
            playwright-report/
            compose.log
          retention-days: 14
      - if: always()
        run: $COMPOSE down --volumes

  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The script parses
        shell: pwsh
        run: |
          $errors = $null
          [void] [System.Management.Automation.Language.Parser]::ParseFile("$pwd\deploy\windows\pairsight.ps1", [ref] $null, [ref] $errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: The installer compiles
        shell: pwsh
        run: |
          # Pinned: the theme needs 6.7 (dark mode, background colours), newer
          # than a runner may have. Same version in onprem-release.yml.
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -notin 0, 3010) { exit $LASTEXITCODE }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc /DAppVersion=0.0.0-ci deploy/windows/pairsight.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # To try before a release: unsigned, and runs the `latest` image.
      - uses: actions/upload-artifact@v4
        with:
          name: PairSight-Setup-ci
          path: deploy/windows/Output/*.exe
          retention-days: 7
